name: Shulker Keep Alive
on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟检查一次，服务器一关机就尽快重启；按需调整频率
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Keep Alive Script
        env:
          SHULKER_USERNAME: ${{ secrets.SHULKER_USERNAME }}
          SHULKER_PASSWORD: ${{ secrets.SHULKER_PASSWORD }}
        run: python shulker_keepalive.py

      - name: Upload debug screenshot (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            login_failed.png
            error.png
            start_result.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep Repo Active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last run: $(date '+%Y-%m-%d %H:%M:%S')" > keep_alive.txt
          git add keep_alive.txt
          git diff --staged --quiet || git commit -m "chore: keep alive $(date '+%Y-%m-%d')"
          git push
